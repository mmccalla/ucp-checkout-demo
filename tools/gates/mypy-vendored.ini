# mypy settings for the vendored samples server only (spec T-103, ADR 0007).
# The sample imports its modules by top-level names, so its folder is the mypy path.
[mypy]
python_version = 3.12
strict = True
explicit_package_bases = True
mypy_path = business/src/ucp_sample_server
incremental = False
show_error_codes = True
